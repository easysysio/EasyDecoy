# EasyDecoy configuration — what is needed before the GUI exists.
#
# Read from the path in EASYDECOY_CONFIG (default: config/easydecoy.toml).
# The decoys, syslog and everything else are set in the management GUI and kept
# in the database. A misspelled key is reported at startup rather than ignored.

# EasyDecoy's own log, written to stderr.
log_level = "info"     # error | warn | info | debug | trace (RUST_LOG wins)

# The database: settings, events, accounts. Created on the first start.
db_path = "easydecoy.db"

# The management GUI, always HTTPS. On this machine only: a decoy host's other
# addresses are for intruders to find. Open https://127.0.0.1:9443/ and create
# the admin account on the first visit.
gui_bind = "127.0.0.1:9443"

# A certificate and key (PEM) for the GUI. Leave both empty to use a
# self-signed certificate, made on the first start.
gui_cert = ""
gui_key  = ""
