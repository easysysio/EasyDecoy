# EasyDecoy configuration (system package default).
#
# Installed to /etc/easydecoy/easydecoy.toml on the first install and never
# overwritten by an upgrade. The systemd unit points EASYDECOY_CONFIG here.
# After editing:  sudo systemctl restart easydecoy

log_level = "info"     # error | warn | info | debug | trace

# One JSON object per line. /var/log/easydecoy is created by the unit's
# LogsDirectory; /etc/logrotate.d/easydecoy rotates the file weekly.
events_file = "/var/log/easydecoy/events.jsonl"

max_connections    = 256
idle_timeout_secs  = 30
session_limit_secs = 120

# The real ports. The service is granted CAP_NET_BIND_SERVICE, so it binds them
# without running as root. A port another service on this host already uses
# stops EasyDecoy at startup (journalctl -u easydecoy says which): move the
# decoy to another port, or disable it.

[telnet]
enabled  = true
bind     = "0.0.0.0:23"
banner   = "Ubuntu 22.04.4 LTS"
hostname = "fileserver01"

[http]
enabled       = true
bind          = "0.0.0.0:80"
server_header = "nginx/1.24.0"
title         = "Admin Console"

# Send every event to a syslog collector as well, e.g. EasyLog. The message
# text is the event's JSON line; login attempts are sent at severity warning,
# everything else at notice. Events are always written to events_file first,
# so a collector that is down only costs dropped messages (reported in
# journalctl -u easydecoy).
[syslog]
enabled  = false
server   = "127.0.0.1:514"    # host:port of the collector
protocol = "udp"              # udp | tcp (newline-framed)
format   = "rfc5424"          # rfc5424 | rfc3164
facility = "local0"           # user | daemon | auth | authpriv | local0 … local7
hostname = ""                 # empty uses this machine's name
