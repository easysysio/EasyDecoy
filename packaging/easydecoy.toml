# EasyDecoy configuration (system package default) — what is needed before
# the GUI exists.
#
# Installed to /etc/easydecoy/easydecoy.toml on the first install and never
# overwritten by an upgrade. The systemd unit points EASYDECOY_CONFIG here.
# The decoys, syslog and everything else are set in the management GUI and
# kept in the database.
# After editing:  sudo systemctl restart easydecoy

log_level = "info"     # error | warn | info | debug | trace

# The database. Empty keeps it in /var/lib/easydecoy, which the unit's
# StateDirectory creates.
db_path = ""

# The management GUI, always HTTPS. On this machine only: a decoy host's other
# addresses are for intruders to find, and the GUI must not be one of them.
# Reach it with an SSH tunnel:
#   ssh -L 9443:127.0.0.1:9443 <this host>
# then open https://localhost:9443/ and create the admin account. To use a
# management network instead, set its address here, never one a decoy uses.
gui_bind = "127.0.0.1:9443"

# A certificate and key (PEM) for the GUI. Leave both empty to use a
# self-signed certificate, made on the first start.
gui_cert = ""
gui_key  = ""
